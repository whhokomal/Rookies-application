# Codemagic CI: builds the Flutter app in rookies_jeans/ on a cloud Mac,
# signs it and uploads it to TestFlight. Signing uses the App Store Connect
# API key added in Codemagic (Team settings -> Integrations -> Developer
# Portal); its name there must match `app_store_connect` below.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: rookies_jeans
    integrations:
      app_store_connect: Rookies ASC key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Named explicitly: the older "rookies_app_store" copy stored in
      # Codemagic predates Push Notifications and can't sign this app.
      ios_signing:
        provisioning_profiles:
          - rookies_app_store_push
        certificates:
          - rookies_distribution
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        # Build number must increase on every upload to App Store Connect;
        # Codemagic's $BUILD_NUMBER goes up by one with every build.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # false: builds go to internal TestFlight testers without Beta App Review.
        submit_to_testflight: false
