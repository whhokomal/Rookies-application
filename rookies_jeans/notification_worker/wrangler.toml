name = "rookies-notifications"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute: send whatever is due. Every hour: check wishlisted products
# for restocks and price drops. Both are free on the Workers free plan.
[triggers]
crons = ["* * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rookies-notifications"
# Printed by `npx wrangler d1 create rookies-notifications` (see README.md).
database_id = "0c739840-c8c7-47a1-b229-67f2d20380ee"

# Non-secret settings. Secrets are set with `npx wrangler secret put <NAME>`
# (see README.md) and never written in this file.
[vars]
SHOPIFY_SHOP_DOMAIN = "rookies-jeans.myshopify.com"
SHOPIFY_API_VERSION = "2026-04"
# Public: the app ships the same token.
SHOPIFY_STOREFRONT_TOKEN = "8127f95aa12da6ed0234550d19abd043"

# Promotional messages wait until morning if they fall in these hours (IST).
QUIET_START = "22:30"
QUIET_END = "09:00"
# Most reminder/offer pushes one person gets in a day (IST). Order and
# shipping updates are never limited.
MAX_PROMOS_PER_DAY = "2"

# Optional discount codes used in the messages. Leave empty for no code.
WELCOME_COUPON = ""
CART_COUPON = ""
WINBACK_COUPON = ""
