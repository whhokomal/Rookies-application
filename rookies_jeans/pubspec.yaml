name: rookies_jeans
description: "Rookies Jeans shopping app."
publish_to: 'none'

version: 1.0.8+12

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  cached_network_image: ^3.4.1
  video_player: ^2.11.1
  go_router: ^17.3.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.0
  share_plus: ^11.0.0
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/          # root assets (images, video, etc.)
    - assets/fonts/    # ← required so Flutter finds the .ttf files

  fonts:
  # HEADING
  - family: Anton
    fonts:
      - asset: assets/fonts/Anton-Regular.ttf

  # SUBHEADING
  - family: BebasNeue
    fonts:
      - asset: assets/fonts/BebasNeue-Regular.ttf

  # BODY (variable font: wght 100–900, wdth 62–125)
  - family: Archivo
    fonts:
      - asset: assets/fonts/Archivo-VariableFont_wdth,wght.ttf

  # ACCENT (variable font: wght 100–700)
  - family: RobotoMono
    fonts:
      - asset: assets/fonts/RobotoMono-VariableFont_wght.ttf

  # Kept only for the ₹ glyph in prices
  - family: Serif4
    fonts:
      - asset: assets/fonts/SourceSerif4.ttf
